name: Publish RouterEasy GHCR image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Production image tag
        required: true
        default: v1.0.0-rc.21-custom.1
        type: string
      git_ref:
        description: Git branch, tag, or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: routereasy-ghcr-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 1

      - name: Resolve image version
        id: version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag: $IMAGE_TAG"
            exit 1
          fi

          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          printf '%s\n' "$IMAGE_TAG" > VERSION

          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-api:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/new-api:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish summary
        run: |
          {
            echo "### RouterEasy new-api image"
            echo
            echo '```text'
            echo "ghcr.io/${{ github.repository_owner }}/new-api:${{ inputs.image_tag }}"
            echo "ghcr.io/${{ github.repository_owner }}/new-api:sha-${{ steps.version.outputs.short_sha }}"
            echo "digest: ${{ steps.image.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
